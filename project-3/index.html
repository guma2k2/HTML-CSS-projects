<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>F8 Project 03</title>
        <!-- Reset -->
        <link rel="stylesheet" href="./assets/css/reset.css" />
        <!-- Style -->
        <link rel="stylesheet" href="./assets/css/style.css" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header-top">
                    <a href="/">
                        <div class="logo">
                            <span class="logo__circle"></span>
                            <span class="logo__text">
                                <span class="logo__brand">shine</span>
                                <span class="logo__brand logo__brand--small">
                                    smile
                                </span>
                            </span>
                        </div>
                    </a>
                    <nav class="navbar">
                        <ul class="nav__list">
                            <li class="nav__item active">
                                <a href="#!" class="nav__link">Home</a>
                            </li>
                            <li class="nav__item">
                                <a href="#!" class="nav__link">Services</a>
                            </li>
                            <li class="nav__item">
                                <a href="#!" class="nav__link">About</a>
                            </li>
                            <li class="nav__item">
                                <a href="#!" class="nav__link">Doctors</a>
                            </li>
                        </ul>
                    </nav>
                    <div class="header-action">
                        <a href="#!" class="header-action__login">Log In</a>
                        <button href="#!" class="btn header-action__signup">
                            Sign Up
                        </button>
                    </div>
                </div>
                <section class="hero">
                    <section class="hero__content">
                        <h1 class="hero__heading">
                            Exceptional dental care for all ages.
                        </h1>
                        <p class="hero__desc">
                            Exceptional dental care for all ages. Your great
                            smile begins with a great dentist.
                        </p>
                        <div class="hero__action">
                            <a class="btn"> Book Online </a>
                            <span class="hero__action__desc"
                                >or call (123) 456-7890</span
                            >
                        </div>
                    </section>
                    <div class="hero__media">
                        <figure>
                            <img
                                src="./assets/img/hero-left.svg"
                                alt=""
                                class="hero-image__left"
                            />
                            <img
                                src="./assets/img/hero-right.svg"
                                alt=""
                                class="hero-image__right"
                            />
                        </figure>
                    </div>
                </section>
            </div>
        </header>

        <!-- Main -->
        <main></main>
        <!-- Footer -->
        <footer class="footer"></footer>
    </body>
</html>
